<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#04010d">
<title>STAR BREAKER - 네온 우주 슈팅</title>
<style>
html,body{margin:0;height:100%;background:#04010d;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   STAR BREAKER — 세로 스크롤 네온 탄막 슈팅
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PW = 480, PH = 720, TAU = Math.PI * 2, PI = Math.PI;
const FONT = '"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
let W, H, S, OX, OY, DPR;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eb = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ---------------- 오디오 ---------------- */
let AC = null, MG = null, NB = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  MG = AC.createGain(); MG.gain.value = .4;
  const comp = AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(f1, f2, dur, type, vol, at) {
  if (!AC || muted) return;
  const t = at || AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, f1, f2, vol, q, at, ft) {
  if (!AC || muted) return;
  const t = at || AC.currentTime, s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = ft || 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random() * .6); s.stop(t + dur + .05);
}
const now = () => AC ? AC.currentTime : 0;
let shotSnd = 0, hitSnd = 0;
const sfx = {
  shot: () => { if (shotSnd > 0) return; shotSnd = .07; tone(1400, 700, .05, 'square', .018); },
  hit: () => { if (hitSnd > 0) return; hitSnd = .04; noise(.04, 3000, 1500, .06, 2); },
  boom: () => { tone(140, 30, .35, 'sine', .45); noise(.35, 1800, 120, .28, .8); },
  big: () => { tone(90, 20, .9, 'sawtooth', .25); noise(1, 1200, 50, .45, .6); },
  graze: () => tone(2400, 3200, .04, 'sine', .03),
  item: () => { tone(900, 1800, .1, 'triangle', .08); },
  power: () => { tone(500, 1000, .12, 'square', .07); tone(750, 1500, .15, 'square', .07, now() + .08); tone(1000, 2000, .2, 'square', .07, now() + .16); },
  bomb: () => { tone(60, 25, 1.4, 'sawtooth', .3); noise(1.3, 200, 5000, .4, .5); tone(1200, 200, .8, 'triangle', .1); },
  hurt: () => { tone(400, 40, .6, 'sawtooth', .25); noise(.6, 2000, 80, .4, .6); },
  warn: () => { for (let i = 0; i < 4; i++) { tone(440, 430, .3, 'square', .08, now() + i * .6); tone(220, 215, .3, 'sawtooth', .06, now() + i * .6); } },
  laserWarn: () => tone(1800, 1800, .5, 'square', .03),
  laser: () => { noise(1.4, 400, 3000, .25, .5); tone(80, 60, 1.4, 'sawtooth', .15); },
  od: () => { tone(200, 1600, .5, 'sawtooth', .12); noise(.6, 500, 6000, .25, .6); },
  shoot: () => tone(600, 300, .06, 'triangle', .025)
};
let nextNote = 0, step = 0;
const SPB = 60 / 150 / 4;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const prog = [38, 38, 34, 36], arp = [0, 7, 12, 15, 12, 7, 3, 7];
function music() {
  if (!AC || muted || state !== 'play' || paused) return;
  if (nextNote < AC.currentTime) nextNote = AC.currentTime + .05;
  while (nextNote < AC.currentTime + .15) {
    const s = step % 16, bar = ((step / 16) | 0) % 4, t = nextNote, root = prog[bar];
    if (s % 4 === 0 || (boss && s === 10)) tone(140, 40, .2, 'sine', .45, t);
    if (s === 4 || s === 12) noise(.13, 2000, 900, .18, .8, t);
    noise(.03, 9000, 7000, s % 2 ? .05 : .025, 1, t, 'highpass');
    if (s % 2 === 0) tone(mtof(root), mtof(root) * .99, SPB * 1.8, 'sawtooth', .05, t);
    tone(mtof(root + 24 + arp[s % 8]), mtof(root + 24 + arp[s % 8]), SPB * .8, 'square', .018, t);
    nextNote += SPB; step++;
  }
}

/* ---------------- 상태 ---------------- */
let state = 'title', paused = false, P = null;
let pbs = [], ebs = [], enemies = [], items = [], parts = [], rings = [], texts = [], banners = [], warps = [];
let score = 0, dispScore = 0, best = 0, chain = 0, chainT = 0, chainPop = 0, maxChain = 0, kills = 0, grazes = 0;
let shake = 0, hitstop = 0, slowmo = 0, flash = 0, flashCol = '#fff', zoom = 1, time = 0, titleT = 0, overT = 0;
let bossPend = 0, stageT = 0, waveT = 2, boss = null, bossT = 0, bossCount = 0, warnT = 0, bombFx = null, newRecord = false, deathT = 0;
let isTouch = false, drag = null, demoT = 0;
const keys = {};
try { best = +localStorage.getItem('starBreakerBest') || 0; } catch (e) {}
const mult = () => 1 + Math.min(chain, 60) * .05;

/* ---------------- 배경 ---------------- */
const starL = [[], [], []];
for (let l = 0; l < 3; l++) for (let i = 0; i < 40 + l * 25; i++) starL[l].push({ x: rnd(0, PW), y: rnd(0, PH), tw: rnd(0, TAU) });
function makeNeb(col, r) {
  const c = document.createElement('canvas'); c.width = c.height = r * 2; const g = c.getContext('2d');
  for (let i = 0; i < 7; i++) {
    const x = r + rnd(-r * .4, r * .4), y = r + rnd(-r * .4, r * .4), rr = rnd(r * .35, r * .6);
    const gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  }
  return c;
}
const nebs = [
  { c: makeNeb('rgba(255,61,245,.16)', 260), x: 60, y: 100, v: 14 },
  { c: makeNeb('rgba(63,140,255,.16)', 300), x: 300, y: -400, v: 10 },
  { c: makeNeb('rgba(255,90,60,.12)', 220), x: 200, y: -900, v: 18 }
];
let bgSpeed = 1;
function updBG(dt) {
  const sp = bgSpeed;
  starL.forEach((L, l) => { const v = (40 + l * 90) * sp; for (const s of L) { s.y += v * dt; if (s.y > PH + 10) { s.y = -10; s.x = rnd(0, PW); } } });
  for (const n of nebs) { n.y += n.v * sp * dt; if (n.y > PH + 50) { n.y = -n.c.height - rnd(100, 500); n.x = rnd(-150, PW - 150); } }
  if (sp > 2 || (P && P.odT > 0)) for (let i = 0; i < 2; i++) warps.push({ x: rnd(0, PW), y: -50, len: rnd(60, 200), v: rnd(1600, 2600) });
  for (const w of warps) w.y += w.v * dt;
  warps = warps.filter(w => w.y - w.len < PH);
}
function drawBG() {
  ctx.fillStyle = '#04010d'; ctx.fillRect(-20, -20, PW + 40, PH + 40);
  for (const n of nebs) ctx.drawImage(n.c, n.x, n.y);
  starL.forEach((L, l) => {
    ctx.fillStyle = l === 2 ? '#fff' : l === 1 ? '#bcd8ff' : '#8a7fb0';
    for (const s of L) {
      ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(time * 2 + s.tw));
      const len = 1 + l + (bgSpeed - 1) * (l + 1) * 6; ctx.fillRect(s.x, s.y, 1 + l * .6, len);
    }
  });
  ctx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#bffcff'; ctx.lineWidth = 1.5;
  for (const w of warps) { ctx.globalAlpha = .25; ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x, w.y - w.len); ctx.stroke(); }
  ctx.restore();
}

/* ---------------- 이펙트 헬퍼 ---------------- */
function addPart(x, y, vx, vy, life, size, col, type, g) {
  if (parts.length > 1100) parts.shift();
  parts.push({ x, y, vx, vy, life, max: life, size, col, type: type || 'spark', g: g || 0, rot: rnd(0, TAU), vr: rnd(-12, 12) });
}
function sparks(x, y, n, cols, pow) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(120, 520) * (pow || 1); addPart(x, y, Math.cos(a) * v, Math.sin(a) * v, rnd(.2, .55), rnd(1.5, 3.5), pick(cols), 'spark'); } }
function ring(x, y, r0, r1, col, life, w, delay) { rings.push({ x, y, r0, r1, col, life, max: life, w, delay: delay || 0 }); }
function addText(x, y, s, col, size) { texts.push({ x, y, s, col, size: size || 18, t: 0, max: .8 }); }
function banner(txt, sub, col, dur) { banners = [{ txt, sub, col, t: 0, dur: dur || 1.6 }]; }
function explode(x, y, size, col) {
  const k = size;
  sparks(x, y, 10 + k * 14, [col, '#fff', '#ffd84a'], .7 + k * .5);
  for (let i = 0; i < 4 + k * 5; i++) addPart(x, y, rnd(-200, 200) * k, rnd(-200, 200) * k, rnd(.5, 1), rnd(3, 7) * (.6 + k * .3), col, 'shard');
  for (let i = 0; i < 3 + k * 3; i++) addPart(x + rnd(-10, 10) * k, y + rnd(-10, 10) * k, rnd(-40, 40), rnd(-40, 40), rnd(.4, .8), rnd(10, 22) * k, '#ff9d4a', 'fire');
  ring(x, y, 4, 40 + k * 50, col, .35 + k * .1, 3 + k * 2); ring(x, y, 2, 25 + k * 30, '#fff', .2, 4);
}

/* ---------------- 플레이어 ---------------- */
function newPlayer() { return { x: PW / 2, y: PH - 110, r: 3.5, lives: 3, bombs: 3, pow: 1, inv: 2.5, fireT: 0, misT: 0, sideT: 0, tilt: 0, od: 0, odT: 0, dead: false, focus: false, odReady: false }; }
function shot(x, y, ang, dmg, col) { pbs.push({ x, y, vx: Math.sin(ang) * 950, vy: -Math.cos(ang) * 950, dmg, type: 'b', col: col || '#ff9df9', ang }); }
function updatePlayer(dt, auto) {
  const p = P; if (p.dead) return;
  p.inv -= dt;
  let dx = 0, dy = 0;
  if (!auto) {
    dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    p.focus = !!(keys.ShiftLeft || keys.ShiftRight || keys.KeyK);
  } else { dx = Math.sin(time * 1.3) * .9; dy = Math.cos(time * .9) * .3; }
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  const sp = p.focus ? 165 : 345;
  p.x += dx * sp * dt; p.y += dy * sp * dt;
  if (drag) { p.x += drag.dx * 1.25; p.y += drag.dy * 1.25; dx += clamp(drag.dx * .3, -1, 1); drag.dx = drag.dy = 0; }
  p.x = clamp(p.x, 16, PW - 16); p.y = clamp(p.y, 30, PH - 24);
  p.tilt = lerp(p.tilt, clamp(dx, -1, 1), Math.min(1, dt * 10));
  addPart(p.x + rnd(-3, 3), p.y + 20, rnd(-20, 20), rnd(200, 320), .2, rnd(2, 4), p.odT > 0 ? '#ffd84a' : '#3ff0ff', 'dot');
  // 사격
  const od = p.odT > 0; if (od) { p.odT -= dt; if (p.odT <= 0) { banner('', '', '#fff', .01); } }
  p.fireT -= dt;
  if (p.fireT <= 0) {
    p.fireT = od ? .05 : .08; const d = od ? 1.5 : 1, L = p.pow;
    shot(p.x - 7, p.y - 14, 0, d); shot(p.x + 7, p.y - 14, 0, d);
    if (L >= 2) { shot(p.x - 4, p.y - 16, -.13, d * .8); shot(p.x + 4, p.y - 16, .13, d * .8); }
    if (L >= 3) { shot(p.x - 4, p.y - 14, -.28, d * .7); shot(p.x + 4, p.y - 14, .28, d * .7); }
    sfx.shot();
  }
  if (p.pow >= 4) { p.misT -= dt; if (p.misT <= 0) { p.misT = od ? .18 : .32; for (const s of [-1, 1]) pbs.push({ x: p.x + s * 14, y: p.y, vx: s * 220, vy: -150, dmg: 3, type: 'm', t: 0, col: '#ffd84a' }); } }
  if (p.pow >= 5) { p.sideT -= dt; if (p.sideT <= 0) { p.sideT = .04; for (const s of [-1, 1]) pbs.push({ x: p.x + s * 20, y: p.y - 4, vx: 0, vy: -1300, dmg: .55, type: 'l', col: '#3ff0ff' }); } }
  if (od) { // 오버드라이브 빔: 기둥 데미지
    for (const e of allTargets()) if (Math.abs(e.x - p.x) < 26 + e.r && e.y < p.y) hurtEnemy(e, 28 * dt, true);
    if (Math.random() < .8) addPart(p.x + rnd(-14, 14), rnd(0, p.y), rnd(-60, 60), rnd(-600, -200), .25, 3, pick(['#fff', '#ffd84a']), 'spark');
  }
  if (p.od >= 100 && !p.odReady) { p.odReady = true; addText(p.x, p.y - 50, 'OVERDRIVE READY!', '#ffd84a', 18); ring(p.x, p.y, 5, 70, '#ffd84a', .4, 4); tone(700, 1400, .2, 'triangle', .1); }
}
function bomb() {
  const p = P; if (p.dead || p.bombs <= 0 || bombFx) return;
  p.bombs--; p.inv = Math.max(p.inv, 2.2);
  bombFx = { x: p.x, y: p.y, t: 0 };
  flash = 1; flashCol = '#ffffff'; shake = 22; zoom = 1.08; hitstop = .06; sfx.bomb();
  ring(p.x, p.y, 10, 700, '#fff', .9, 14); ring(p.x, p.y, 10, 600, '#3ff0ff', 1.1, 8, .1); ring(p.x, p.y, 10, 500, '#ff3df5', 1.2, 6, .2);
  banner('BOMB!', '', '#3ff0ff', .8);
}
function overdrive() {
  const p = P; if (p.dead || p.od < 100) return;
  p.od = 0; p.odReady = false; p.odT = 6; p.inv = Math.max(p.inv, 1);
  flash = .7; flashCol = '#ffd84a'; shake = 16; zoom = 1.06; slowmo = .25; sfx.od();
  ring(p.x, p.y, 10, 300, '#ffd84a', .6, 8);
  banner('OVERDRIVE', '6초간 화력 최대!', '#ffd84a', 1.2);
}
function hurtPlayer() {
  const p = P; if (p.dead || p.inv > 0 || state !== 'play') return;
  p.lives--; explode(p.x, p.y, 2.2, '#3ff0ff'); sfx.hurt();
  shake = 26; flash = .6; flashCol = '#ff2d55'; hitstop = .12; slowmo = .6; chain = 0;
  for (const b of ebs) if (Math.hypot(b.x - p.x, b.y - p.y) < 220) { b.dead = true; addPart(b.x, b.y, 0, 0, .3, 4, b.col, 'dot'); }
  if (p.lives <= 0) {
    p.dead = true; deathT = 2.2; slowmo = 1.5; banner('SHIP DOWN', '', '#ff2d55', 2);
    for (let i = 0; i < 5; i++) setTimeout(() => explode(p.x + rnd(-30, 30), p.y + rnd(-30, 30), 1.5, pick(['#3ff0ff', '#ff3df5', '#ffd84a'])), i * 140);
  } else {
    p.pow = Math.max(1, p.pow - 1); p.bombs = Math.max(p.bombs, 2); p.inv = 3; p.odT = 0;
    addText(p.x, p.y - 40, '-1 LIFE', '#ff2d55', 22);
  }
}

/* ---------------- 적 ---------------- */
function enemy(type, x, y, o) {
  const base = {
    fighter: { hp: 3, r: 14, val: 100, col: '#ff2d55' },
    turret: { hp: 22, r: 20, val: 500, col: '#ff8a1e' },
    carrier: { hp: 70, r: 36, val: 1500, col: '#b14cff' },
    kamikaze: { hp: 2, r: 11, val: 150, col: '#ffd84a' }
  }[type];
  const hpScale = 1 + bossCount * .35;
  const e = Object.assign({ type, x, y, vx: 0, vy: 0, t: 0, flash: 0, fireT: rnd(.8, 1.6), dead: false }, base, o || {});
  e.hp *= hpScale; e.maxHp = e.hp;
  enemies.push(e); return e;
}
function spawnWave() {
  const d = Math.min(1.5, stageT / 120 + bossCount * .35);
  const r = Math.random();
  if (r < .3) { // 사인 편대
    const x0 = rnd(90, PW - 90), ph = rnd(0, TAU);
    for (let i = 0; i < 5; i++) enemy('fighter', x0, -30 - i * 42, { path: 'sine', x0, ph: ph + i * .5, amp: rnd(60, 120), spd: 140 + d * 40 });
  } else if (r < .5) { // V자 급강하
    const cx = rnd(120, PW - 120);
    for (let i = 0; i < 5; i++) { const o = i - 2; enemy('fighter', cx + o * 40, -30 - Math.abs(o) * 30, { path: 'dive', ty: 120 + Math.abs(o) * 20 + rnd(0, 30), wait: .6 + Math.abs(o) * .15 }); }
  } else if (r < .65 || d < .25) { // 측면 휘어 들어오기
    const side = Math.random() < .5 ? -1 : 1;
    for (let i = 0; i < 6; i++) enemy('fighter', side < 0 ? -30 - i * 36 : PW + 30 + i * 36, 80 + i * 6, { path: 'swoop', side, spd: 230 + d * 60 });
  } else if (r < .8) { // 포탑
    const n = d > .7 ? 3 : 2;
    for (let i = 0; i < n; i++) enemy('turret', PW * (i + 1) / (n + 1), -40, { ty: rnd(110, 200), life: 8 });
  } else if (r < .9 && d > .3) { // 항모
    enemy('carrier', rnd(140, PW - 140), -60, { ty: 130, life: 14 });
  } else { // 자폭기 떼
    const n = 4 + Math.floor(d * 4);
    for (let i = 0; i < n; i++) enemy('kamikaze', rnd(30, PW - 30), -30 - i * 50);
  }
  waveT = Math.max(1.1, 2.7 - d * 1.1);
}
function aimed(x, y, spd, spread, n, col, r) {
  const a0 = Math.atan2(P.y - y, P.x - x);
  for (let i = 0; i < n; i++) { const a = a0 + (i - (n - 1) / 2) * spread; ebs.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: r || 5, col: col || '#ff3df5' }); }
}
function ringShot(x, y, n, spd, off, col, r) { for (let i = 0; i < n; i++) { const a = off + i / n * TAU; ebs.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: r || 5, col: col || '#ff8a1e' }); } }
function updEnemy(e, dt) {
  e.t += dt; e.flash -= dt;
  const dif = Math.min(1.5, stageT / 120 + bossCount * .35);
  switch (e.type) {
    case 'fighter':
      if (e.path === 'sine') { e.y += e.spd * dt; e.x = e.x0 + Math.sin(e.t * 2.2 + e.ph) * e.amp; }
      else if (e.path === 'dive') {
        if (!e.diving) { e.y = lerp(e.y, e.ty, Math.min(1, dt * 3)); if (e.t > e.wait + .8) { e.diving = true; const a = Math.atan2(P.y - e.y, P.x - e.x); e.vx = Math.cos(a) * 360; e.vy = Math.max(200, Math.sin(a) * 360); aimed(e.x, e.y, 200 + dif * 60, .25, 3, '#ff2d55'); } }
        else { e.x += e.vx * dt; e.y += e.vy * dt; }
      } else { e.x += -e.side * e.spd * dt; e.y += (60 + e.t * 90) * dt; }
      if (dif > .3 && e.path === 'sine') { e.fireT -= dt; if (e.fireT <= 0 && e.y > 40) { e.fireT = rnd(1.6, 3); aimed(e.x, e.y, 190 + dif * 50, 0, 1, '#ff2d55'); } }
      break;
    case 'turret':
      if (e.t < e.life) e.y = lerp(e.y, e.ty, Math.min(1, dt * 2.5)); else e.y += 120 * dt;
      e.aim = Math.atan2(P.y - e.y, P.x - e.x);
      e.fireT -= dt;
      if (e.fireT <= 0 && e.t > .8 && e.t < e.life) {
        e.fireT = Math.max(.8, 1.7 - dif * .5);
        for (let k = 0; k < 3; k++) setTimeout(() => { if (!e.dead && state === 'play') { aimed(e.x + Math.cos(e.aim) * 22, e.y + Math.sin(e.aim) * 22, 220 + dif * 70, .18, dif > .8 ? 3 : 1, '#ff8a1e', 6); sfx.shoot(); } }, k * 110);
      }

  let x = PW / 2 - tw / 2;
  [...go].forEach((c, i) => {
    const k = (overT - .06 * i) / .5, sc = k < 1 ? 3 - 2 * eo(k) : 1;
    if (k > 0) { ctx.save(); ctx.globalAlpha = clamp(k * 2, 0, 1); ctx.translate(x + ws[i] / 2, 170); ctx.scale(sc, sc); txt(c, 0, 0, 60, '#ff3df5', { st: 6, sc: '#1a0010' }); ctx.restore(); }
    x += ws[i];
  });
  const rows = [['점수', Math.floor(score).toLocaleString()], ['격추', kills + ''], ['그레이즈', grazes + ''], ['최대 체인', maxChain + ''], ['격파한 보스', bossCount + ''], ['최고 기록', best.toLocaleString()]];
  rows.forEach((r, i) => {
    const k = eo((overT - .6 - i * .1) / .35); if (k <= 0) return;
    ctx.globalAlpha = k; const ox = (1 - k) * 60;
    txt(r[0], PW / 2 - 14 + ox, 250 + i * 34, 17, '#ffb3e6', { al: 'right', it: false, st: 4 });
    txt(r[1], PW / 2 + 14 + ox, 250 + i * 34, 22, '#fff', { al: 'left', st: 5 });
  });
  ctx.globalAlpha = 1;
  if (newRecord && overT > 1.2 && Math.floor(time * 5) % 2) txt('NEW RECORD!', PW / 2, 480, 26, '#ffd84a', { st: 5 });
  if (overT > 1) { ctx.globalAlpha = .55 + .45 * Math.sin(time * 5); txt(isTouch ? '탭하여 재출격' : 'SPACE 또는 클릭으로 재출격', PW / 2, 540, 20, '#fff', { st: 5 }); ctx.globalAlpha = 1; }
  menuBtn();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#020008'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
  ctx.save();
  const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
  ctx.translate(PW / 2 + sx, PH / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-PW / 2, -PH / 2);
  drawBG();
  drawItems();
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss(boss);
  if (state !== 'over') drawPlayer();
  drawBullets();
  drawParts(); drawRings(); drawTexts();
  if (bombFx) {
    const k = bombFx.t, R = eo(k / .8) * 760;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k;
    const g = ctx.createRadialGradient(bombFx.x, bombFx.y, R * .7, bombFx.x, bombFx.y, R); g.addColorStop(0, 'rgba(63,240,255,0)'); g.addColorStop(.85, 'rgba(63,240,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bombFx.x, bombFx.y, R, 0, TAU); ctx.fill(); ctx.restore();
  }
  ctx.restore();
  const vg = ctx.createRadialGradient(PW / 2, PH / 2, PH * .3, PW / 2, PH / 2, PH * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, PW, PH);
  if (warnT > 0) { ctx.globalAlpha = .2 + .2 * Math.sin(time * 18); ctx.fillStyle = '#ff1e3c'; ctx.fillRect(0, 0, PW, 8); ctx.fillRect(0, PH - 8, PW, 8); ctx.fillRect(0, 0, 8, PH); ctx.fillRect(PW - 8, 0, 8, PH); ctx.globalAlpha = 1; }
  if (state === 'play' && P.lives === 1 && !P.dead) { ctx.fillStyle = `rgba(255,20,60,${.1 + .08 * Math.sin(time * 8)})`; ctx.fillRect(0, 0, PW, 4); ctx.fillRect(0, PH - 4, PW, 4); }
  if (flash > 0) { ctx.globalAlpha = clamp(flash, 0, 1) * .7; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, PW, PH); ctx.globalAlpha = 1; }
  for (const b of banners) drawBanner(b);
  if (state === 'play') { drawHUD(); if (isTouch) drawButtons(); }
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused && state === 'play') { ctx.fillStyle = 'rgba(4,1,13,.6)'; ctx.fillRect(0, 0, PW, PH); txt('PAUSED', PW / 2, PH / 2 - 10, 56, '#fff', { st: 6 }); txt('P 키 또는 탭하여 계속', PW / 2, PH / 2 + 36, 16, '#ffb3e6', { it: false, st: 4 }); }
  if (muted) txt('🔇', PW - 18, PH - 18, 14, '#fff', { it: false });
  ctx.restore();
  // 플레이필드 테두리
  ctx.strokeStyle = 'rgba(255,61,245,.55)'; ctx.lineWidth = 2; ctx.shadowColor = '#ff3df5'; ctx.shadowBlur = 14;
  ctx.strokeRect(-1, -1, PW + 2, PH + 2); ctx.shadowBlur = 0;
}

/* ---------------- 입력 ---------------- */
const goMenu = () => { location.href = 'index.html'; };
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  keys[k] = true; if (e.repeat) return; initAudio();
  if (k === 'KeyM') { muted = !muted; return; }
  if (k === 'KeyQ' && state !== 'play') { goMenu(); return; }
  if (state === 'title') { if (k === 'Space' || k === 'Enter') start(); return; }
  if (state === 'over') { if ((k === 'Space' || k === 'Enter') && overT > 1) start(); return; }
  if (k === 'KeyP' || k === 'Escape') { paused = !paused; return; }
  if (paused) return;
  if (k === 'Space' || k === 'KeyX') bomb();
  else if (k === 'KeyE' || k === 'KeyC') overdrive();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const toL = e => ({ x: (e.clientX - OX) / S, y: (e.clientY - OY) / S });
cv.addEventListener('pointerdown', e => {
  initAudio(); if (e.pointerType === 'touch') isTouch = true;
  const p = toL(e);
  if (state !== 'play' && p.x < 108 && p.y < 44 && p.x > 0) { goMenu(); return; }
  if (state === 'title') { start(); return; }
  if (state === 'over') { if (overT > 1) start(); return; }
  if (paused) { paused = false; return; }
  for (const b of buttons()) if (isTouch && (p.x - b.x) ** 2 + (p.y - b.y) ** 2 < (b.r + 10) ** 2) { b.fn(); return; }
  drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY, dx: 0, dy: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  drag.dx += (e.clientX - drag.lx) / S; drag.dy += (e.clientY - drag.ly) / S; drag.lx = e.clientX; drag.ly = e.clientY;
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { if (state === 'play') paused = true; for (const k in keys) keys[k] = false; });

/* ---------------- 시작 ---------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth || 960; H = innerHeight || 720;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / PW, H / PH); OX = (W - PW * S) / 2; OY = (H - PH * S) / 2;
}
addEventListener('resize', resize); resize();
P = newPlayer(); P.inv = 0;
let last = performance.now();
function loop(t) { const rdt = Math.min(.033, (t - last) / 1000); last = t; update(rdt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
