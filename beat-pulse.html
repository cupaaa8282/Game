<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   BEAT PULSE — 4레인 네온 리듬 게임 (음악은 WebAudio로 실시간 합성)
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const LH = 600, TAU = Math.PI * 2, PI = Math.PI;
const FONT = '"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
let W, H, S, LW, DPR;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eb = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ---------------- 오디오 ---------------- */
let AC = null, MG = null, NB = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  MG = AC.createGain(); MG.gain.value = .5;
  const comp = AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(f1, f2, dur, type, vol, at) {
  if (!AC || muted) return;
  const t = Math.max(at || 0, AC.currentTime), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, f1, f2, vol, q, at, ft) {
  if (!AC || muted) return;
  const t = Math.max(at || 0, AC.currentTime), s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = ft || 'bandpass'; f.Q.value = q || 1;

  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function playEv(e, t, spb) {
  switch (e.t) {
    case 'k': tone(160, 38, .24, 'sine', .6, t); noise(.02, 4000, 2000, .08, 1, t); break;
    case 's': noise(.17, 2000, 800, .26, .8, t); tone(230, 120, .09, 'triangle', .12, t); break;
    case 'h': noise(.035, 9500, 7000, e.o ? .07 : .045, 1, t, 'highpass'); break;

/* ---------------- 곡 데이터 & 채보 생성 ---------------- */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SONGS = [
  { id: 'drift', name: 'NEON DRIFT', sub: '네온 드리프트', bpm: 110, diff: 1, root: 57, seed: 11, col: '#3ff0ff', col2: '#2a6bff', secs: [[2, 0], [8, 1], [8, 2], [8, 2], [2, 1]] },
  { id: 'circuit', name: 'MIDNIGHT CIRCUIT', sub: '미드나잇 서킷', bpm: 128, diff: 2, root: 50, seed: 23, col: '#ff3df5', col2: '#7a2bff', secs: [[2, 0], [8, 2], [4, 1], [8, 3], [8, 2], [2, 1]] },
  { id: 'hyper', name: 'HYPER PULSE', sub: '하이퍼 펄스', bpm: 150, diff: 3, root: 52, seed: 37, col: '#ffd84a', col2: '#ff4d2b', secs: [[2, 1], [8, 2], [8, 3], [4, 1], [8, 3], [2, 1]] }
];
const PROG = [0, 8, 3, 10], PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
const RHY = [[0, 3, 6, 8, 11, 14], [0, 2, 4, 7, 10, 12], [0, 4, 6, 8, 12, 14], [0, 3, 6, 10, 12], [0, 6, 8, 10, 14]];
function buildSong(sg) {
  const rng = mulberry(sg.seed), d = sg.diff - 1, ev = [], notes = [], barInt = [];
  const busy = [-1, -1, -1, -1], used = {};
  let bar = 0, kt = 0, st2 = 0;
  const addNote = (step, lane, len) => {
    if ((used[step] || 0) >= 2) return;
    for (let k = 0; k < 4; k++) {
      const c = (lane + k) % 4;
      if (busy[c] < step && !used[step + '_' + c]) {
        used[step] = (used[step] || 0) + 1; used[step + '_' + c] = 1; busy[c] = step + (len ? len + 1 : 0);

  };
  for (const [nb, I] of sg.secs) for (let i = 0; i < nb; i++, bar++) {
    barInt.push(I);
    const base = bar * 16, ch = PROG[bar % 4], broot = sg.root - 24 + ch, rhy = RHY[(rng() * RHY.length) | 0];
    let pi = 3 + ((rng() * 4) | 0);

    for (let s = 0; s < 16; s++) {
      const st = base + s;
      if ((I >= 1 && s % 4 === 0) || (I === 3 && (s === 10 || (s === 14 && bar % 2)))) ev.push({ st, t: 'k' });
      if ((I >= 2 && (s === 4 || s === 12)) || (I === 3 && s === 15 && bar % 4 === 3)) ev.push({ st, t: 's' });
      if (I >= 1 && (s % 4 === 2 || (I === 3 && s % 2 === 1))) ev.push({ st, t: 'h', o: s % 4 === 2 });
      if (I >= 1 && s % 2 === 0) ev.push({ st, t: 'b', m: broot + (s % 8 === 6 ? 12 : 0) });

    if (bar > 0 && (I <= 1) && bar % 2 === 1) addNote(base, (rng() * 4) | 0, 8);

SONGS.forEach(s => { const b = buildSong(s); s.noteCount = b.notes.length + b.notes.filter(n => n.len).length; s.dur = b.len; });

/* ---------------- 상태 ---------------- */
let state = 'select', sel = 0, song = null, chart = null, notes = [], gameT = 0, t0 = 0, acAnchor = null, evI = 0, time = 0, stT = 0;
let score = 0, dispScore = 0, combo = 0, maxCombo = 0, comboPop = 0, fever = false, feverT = 0, counts = { P: 0, G: 0, O: 0, M: 0 }, totalJ = 1;
let held = [false, false, false, false], recv = [0, 0, 0, 0], laneFlash = [0, 0, 0, 0], laneMiss = [0, 0, 0, 0], judgeShow = null;
let parts = [], rings = [], texts = [], banners = [], eq = new Array(32).fill(0), shake = 0, flash = 0, flashCol = '#fff', missFx = 0;
let speedMod = 1, offsetMs = 0, best = {}, newRecord = false, resultT = 0, selPop = 0, isTouch = false, finished = false;
try { best = JSON.parse(localStorage.getItem('beatPulseBest') || '{}') || {}; if (typeof best !== 'object') best = {}; } catch (e) { best = {}; }
try { const o = JSON.parse(localStorage.getItem('beatPulseOpt') || '{}'); speedMod = o.speed || 1; offsetMs = o.offset || 0; } catch (e) {}
const saveOpt = () => { try { localStorage.setItem('beatPulseOpt', JSON.stringify({ speed: speedMod, offset: offsetMs })); } catch (e) {} };
const KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'], KEYL = ['D', 'F', 'J', 'K'];
const songT = () => gameT - t0 - offsetMs / 1000;
const WIN = { P: .045, G: .09, O: .13 };
const JNAME = { P: 'PERFECT', G: 'GREAT', O: 'GOOD', M: 'MISS' }, JCOL = { P: '#7ffcff', G: '#ff9df9', O: '#ffd84a', M: '#ff2d55' }, JW = { P: 1, G: .7, O: .4, M: 0 };

/* ---------------- 레이아웃 ---------------- */
const JY = () => LH - 110;
const laneW = () => Math.min(88, (LW - 24) / 4);
const laneX = l => LW / 2 - 2 * laneW() + l * laneW();
const laneCol = l => fever ? `hsl(${(time * 160 + l * 70) % 360},100%,65%)` : (l === 0 || l === 3 ? song.col : '#ffffff');
const noteSpeed = () => 520 * speedMod;

/* ---------------- 이펙트 ---------------- */
function addPart(x, y, vx, vy, life, size, col, type, g) { if (parts.length > 900) parts.shift(); parts.push({ x, y, vx, vy, life, max: life, size, col, type: type || 'spark', g: g || 0 }); }

function banner(txt, sub, col, dur) { banners = [{ txt, sub, col, t: 0, dur: dur || 1.5 }]; }

/* ---------------- 게임 흐름 ---------------- */
function startSong(i) {
  initAudio();
  song = SONGS[i]; chart = buildSong(song);
  notes = chart.notes.map(n => ({ lane: n.lane, time: n.step * chart.spb, end: (n.step + n.len) * chart.spb, len: n.len, done: false, holding: false, tailDone: !n.len }));
  totalJ = notes.length + notes.filter(n => n.len).length;
  gameT = 0; t0 = 2.6; acAnchor = null; evI = 0; finished = false;
  score = 0; dispScore = 0; combo = 0; maxCombo = 0; fever = false; feverT = 0; counts = { P: 0, G: 0, O: 0, M: 0 };
  held = [false, false, false, false]; parts = []; rings = []; texts = []; judgeShow = null; newRecord = false;
  state = 'play'; stT = 0; flash = .6; flashCol = song.col;
  banner(song.name, song.sub + '  ·  BPM ' + song.bpm, song.col, 2);
  tone(300, 1200, .4, 'sawtooth', .08);
}
function judge(n, g, dt) {

    return;

  score += Math.round(base * JW[g] * (fever ? 2 : 1)) + combo * 3;
  judgeShow = { g, t: 0, dt };
  laneFlash[n.lane] = 1;
  const c = laneCol(n.lane);
  sparks(x, y, g === 'P' ? 22 : 14, [c, '#fff', JCOL[g]], g === 'P' ? 1.2 : .9);
  ring(x, y, 8, g === 'P' ? 80 : 60, JCOL[g], .35, g === 'P' ? 5 : 3);
  if (g === 'P') ring(x, y, 4, 40, '#fff', .2, 4);
  for (let i = 0; i < 6; i++) eq[(Math.random() * 32) | 0] = 1;
  if (!muted && AC) tone(2400, 1800, .025, 'sine', .03);
  if (combo === 50 || (combo > 50 && !fever)) { if (!fever) { fever = true; feverT = 0; banner('FEVER!!', '점수 ×2', '#ffd84a', 1.4); flash = .6; flashCol = '#ffd84a'; for (let l = 0; l < 4; l++) ring(laneX(l) + laneW() / 2, y, 10, 160, '#ffd84a', .6, 6); tone(400, 1600, .4, 'sawtooth', .07); } }
  if (combo > 0 && combo % 100 === 0) banner(combo + ' COMBO', '', '#7ffcff', 1.1);
}
function press(l) {

  for (const n of notes) {
    if (n.lane !== l || n.done || n.holding) continue;
    const dt = t - n.time;
    if (dt < -WIN.O) break;
    if (Math.abs(dt) <= WIN.O) { hit = n; bdt = dt; break; }

  const a = Math.abs(bdt), g = a <= WIN.P ? 'P' : a <= WIN.G ? 'G' : 'O';
  judge(hit, g, bdt);

}
function release(l) {
  held[l] = false;
  if (state !== 'play') return;
  const t = songT();
  for (const n of notes) if (n.lane === l && n.holding) {
    n.holding = false; n.done = true; n.tailDone = true;
    if (t < n.end - WIN.O) { judge(n, 'M', 0); addTextLane(l, 'BREAK', '#ff2d55'); }

}
function addTextLane(l, s, col) { texts.push({ x: laneX(l) + laneW() / 2, y: JY() - 40, s, col, t: 0, max: .7, size: 16 }); }

}
function accuracy() { const n = counts.P + counts.G + counts.O + counts.M; return n ? (counts.P + counts.G * .7 + counts.O * .4) / n * 100 : 0; }

/* ---------------- 업데이트 ---------------- */
function update(dt) {

  shake *= Math.pow(.002, dt); if (shake < .2) shake = 0;

/* ---------------- 그리기 ---------------- */
function txt(s, x, y, size, col, o) {

function para(x, y, w, h, sk) { ctx.beginPath(); ctx.moveTo(x + sk, y); ctx.lineTo(x + w + sk, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); }

}
function drawBG() {
  const sg = state === 'select' ? SONGS[sel] : song, bi = beatInfo(), ph = ((bi.beat % 1) + 1) % 1, pulse = bi.I >= 1 || state !== 'play' ? Math.pow(1 - ph, 3) : 0;

  g.addColorStop(0, fever ? `hsl(${(time * 60 + 40) % 360},90%,22%)` : sg.col2 + '55'); g.addColorStop(.5, c1); g.addColorStop(1, '#04010d');

  for (let i = 0; i < 12; i++) {
    const k = ((i + (bi.beat * sp) % 1) / 12), r = Math.pow(k, 2.2) * Math.max(LW, LH) * 1.3;
    ctx.save(); ctx.rotate(bi.beat * .08 + i * .05);

  }
  ctx.globalAlpha = .12; ctx.strokeStyle = sg.col; ctx.lineWidth = 1;

  if (newRecord && k > 1.6 && Math.floor(time * 5) % 2) txt('NEW RECORD!', sx + 110, sy + 76 + 6 * 28 + 10, 22, '#ffd84a', { st: 5 });
  if (k > 1.6) { ctx.globalAlpha = .55 + .45 * Math.sin(time * 5); txt(isTouch ? '탭하여 곡 선택으로' : 'Enter 곡 선택 · R 다시 하기 · Q 메뉴', LW / 2, LH - 30, 18, '#fff', { st: 5, it: false }); ctx.globalAlpha = 1; }
  menuBtn();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04010d'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  ctx.save();
  if (shake) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  drawBG();
  if (state !== 'select') { drawLanes(); drawNotes(); drawFX(); }
  ctx.restore();
  if (state === 'play') drawPlayHUD();
  if (state === 'select') drawSelect();
  if (state === 'result') drawResult();
  if (state !== 'play') drawFX();
  for (const b of banners) drawBanner(b);
  if (flash > 0) { ctx.globalAlpha = clamp(flash, 0, 1) * .5; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
  const vg = ctx.createRadialGradient(LW / 2, LH / 2, LH * .35, LW / 2, LH / 2, Math.max(LW, LH) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, LW, LH);
  if (muted) txt('🔇', LW - 22, LH - 20, 16, '#fff', { it: false });
}

/* ---------------- 입력 ---------------- */
const goMenu = () => { location.href = 'index.html'; };
function selMove(d) { sel = (sel + d + SONGS.length) % SONGS.length; selPop = 1; initAudio(); const s = SONGS[sel]; tone(mtof(s.root + 12), mtof(s.root + 12), .1, 'square', .05); tone(mtof(s.root + 19), mtof(s.root + 19), .12, 'square', .04, AC ? AC.currentTime + .07 : 0); }
function toSelect() { state = 'select'; stT = 1.4; drawResult.boomed = false; fever = false; parts = []; rings = []; }
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  initAudio();
  const li = KEYS.indexOf(k);
  if (li >= 0) { press(li); if (state === 'play') return; }
  if (k === 'KeyM') { muted = !muted; return; }
  if (state === 'select') {
    if (k === 'ArrowLeft') selMove(-1);
    else if (k === 'ArrowRight') selMove(1);
    else if (k === 'ArrowUp') { speedMod = clamp(Math.round((speedMod + .1) * 10) / 10, .5, 2.5); saveOpt(); }
    else if (k === 'ArrowDown') { speedMod = clamp(Math.round((speedMod - .1) * 10) / 10, .5, 2.5); saveOpt(); }
    else if (k === 'BracketLeft') { offsetMs = clamp(offsetMs - 5, -200, 200); saveOpt(); }
    else if (k === 'BracketRight') { offsetMs = clamp(offsetMs + 5, -200, 200); saveOpt(); }
    else if (k === 'Enter' || k === 'Space') startSong(sel);
    else if (k === 'KeyQ') goMenu();
  } else if (state === 'play') {
    if (k === 'Escape') toSelect();
  } else if (state === 'result' && resultT > 1) {
    if (k === 'Enter' || k === 'Space') toSelect();
    else if (k === 'KeyR') { drawResult.boomed = false; startSong(SONGS.indexOf(song)); }
    else if (k === 'KeyQ') goMenu();
  }
});
addEventListener('keyup', e => { const li = KEYS.indexOf(e.code); if (li >= 0) release(li); });
const touchLane = {};
cv.addEventListener('pointerdown', e => {
  initAudio(); if (e.pointerType === 'touch') isTouch = true;
  const x = e.clientX / S, y = e.clientY / S;
  if (state !== 'play' && x < 112 && y < 48) { goMenu(); return; }
  if (state === 'play') {
    const l = Math.floor((x - laneX(0)) / laneW());
    if (l >= 0 && l < 4) { touchLane[e.pointerId] = l; press(l); try { cv.setPointerCapture(e.pointerId); } catch (er) {} }
    return;
  }
  if (state === 'select') {
    const rs = cardRects();
    for (let i = 0; i < rs.length; i++) { const r = rs[i]; if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) { if (i === sel) startSong(i); else selMove(i - sel); return; } }
    if (!isTouch) startSong(sel);
    return;
  }
  if (state === 'result' && resultT > 1.6) toSelect();
});
const upTouch = e => { const l = touchLane[e.pointerId]; if (l != null) { delete touchLane[e.pointerId]; release(l); } };
cv.addEventListener('pointerup', upTouch); cv.addEventListener('pointercancel', upTouch);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- 시작 ---------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth || 960; H = innerHeight || 600;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); S = H / LH; LW = W / S;
}
addEventListener('resize', resize); resize();
let last = performance.now();
function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
