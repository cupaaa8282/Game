<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#05030c">
<title>SHADOW DASH - 네온 도시의 악당 사냥꾼</title>
<style>
html,body{margin:0;height:100%;background:#05030c;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   SHADOW DASH — 달리면서 악당을 베는 네온 액션 러너
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const LH = 540, GY = 455, TAU = Math.PI * 2, PI = Math.PI;
const FONT = '"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
let W, H, S, LW, DPR, skyG = null, vig = null;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eb = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ---------------- 오디오 (WebAudio 합성) ---------------- */
let AC = null, MG = null, NB = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  MG = AC.createGain(); MG.gain.value = .45;
  const comp = AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(f1, f2, dur, type, vol, at) {
  if (!AC || muted) return;
  const t = at || AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, f1, f2, vol, q, at, ft) {
  if (!AC || muted) return;
  const t = at || AC.currentTime, s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = ft || 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random() * .6); s.stop(t + dur + .05);
}
const now = () => AC ? AC.currentTime : 0;
const sfx = {
  jump: () => tone(260, 620, .14, 'square', .05),
  jump2: () => { tone(400, 1100, .18, 'triangle', .1); noise(.2, 800, 3000, .08, 1); },
  slash: () => { noise(.16, 4200, 900, .22, 1.5); tone(900, 300, .08, 'sawtooth', .03); },
  hit: () => { tone(180, 45, .18, 'sine', .5); noise(.09, 2500, 400, .25, 1); },
  kill: () => { tone(120, 30, .35, 'sine', .6); noise(.3, 1200, 100, .3, .8); tone(1200, 2400, .1, 'square', .04); },
  dash: () => noise(.28, 300, 3000, .25, .8),
  hurt: () => { tone(300, 50, .4, 'sawtooth', .18); noise(.25, 800, 200, .25, 1); },
  land: () => noise(.08, 600, 150, .12, 1),
  slam: () => { tone(90, 25, .6, 'sine', .8); noise(.5, 1500, 60, .4, .7); },
  special: () => { tone(60, 30, 1.2, 'sawtooth', .25); noise(1.1, 200, 6000, .35, .6); tone(800, 3000, .5, 'sine', .12); tone(1600, 200, 1, 'triangle', .08, now() + .15); },
  orb: () => tone(1200 + Math.random() * 400, 2400, .07, 'sine', .04),
  reflect: () => tone(1500, 3500, .12, 'square', .06),
  warn: () => { for (let i = 0; i < 4; i++) { tone(440, 430, .28, 'square', .09, now() + i * .55); tone(220, 215, .28, 'sawtooth', .06, now() + i * .55); } },
  boss: () => { tone(80, 20, 2, 'sawtooth', .3); noise(2, 100, 4000, .3, .5); },
  heal: () => { tone(600, 1200, .2, 'sine', .15); tone(900, 1800, .2, 'sine', .1, now() + .08); },
  ready: () => { tone(500, 1000, .15, 'triangle', .1); tone(750, 1500, .2, 'triangle', .1, now() + .1); }
};
/* 배경 음악: 간단한 시퀀서 */
let nextNote = 0, step = 0;
const SPB = 60 / 142 / 4;
const bassSeq = [0, 0, 12, 0, 0, 12, 0, 10, 0, 0, 12, 0, 7, 0, 10, 12];
const roots = [33, 33, 29, 31];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function music() {
  if (!AC || muted || state !== 'play' || paused || (P && P.dead)) return;
  if (nextNote < AC.currentTime) nextNote = AC.currentTime + .05;
  while (nextNote < AC.currentTime + .15) {
    const s = step % 16, bar = ((step / 16) | 0) % 4, t = nextNote;
    if (s % 4 === 0) tone(150, 40, .22, 'sine', .5, t);
    if (s === 4 || s === 12) noise(.14, 1800, 900, .2, .8, t);
    if (s % 2 === 1) noise(.04, 9000, 7000, .05, 1, t, 'highpass');
    const n = roots[bar] + 12 + bassSeq[s];
    tone(mtof(n), mtof(n) * .99, SPB * .9, 'sawtooth', .05, t);
    if (boss && s % 4 === 2) tone(mtof(roots[bar] + 36 + (s === 10 ? 3 : 0)), mtof(roots[bar] + 36), SPB * 1.5, 'square', .025, t);
    nextNote += SPB; step++;
  }
}

/* ---------------- 게임 상태 ---------------- */
let state = 'title', paused = false, P = null;
let enemies = [], corpses = [], bullets = [], parts = [], rings = [], texts = [], slashes = [], ghosts = [],
    orbs = [], hazards = [], banners = [], beams = [], stars4 = [], fg = [], lines = [];
let speed = 380, dist = 0, score = 0, dispScore = 0, combo = 0, comboT = 0, comboPop = 0, maxCombo = 0, kills = 0;
let shake = 0, hitstop = 0, slowmo = 0, flash = 0, flashCol = '#fff', zoom = 1, focus = 0, time = 0;
let spawnT = 1.2, boss = null, bossPending = 0, bossCount = 0, nextBoss = 900, warnT = 0, deathT = 0, overT = 0, titleT = 0;
let gscroll = 0, fgT = 1, demoT = 1, newRecord = false, best = 0, bossDisp = 1, isTouch = false;
try { best = +localStorage.getItem('shadowDashBest') || 0; } catch (e) {}
const keys = {};
const meters = () => Math.floor(dist / 40);
const mult = () => 1 + Math.floor(combo / 10) * .5;

/* ---------------- 배경 ---------------- */
const layers = [
  { f: .06, col: '#2b1050', win: ['#ff6ad5', '#8a5cff'], hmin: 160, hmax: 310, b: [], scroll: 0 },
  { f: .18, col: '#1d0a36', win: ['#ff4fa3', '#56e0ff', '#ffd36a'], hmin: 110, hmax: 240, b: [], scroll: 0 },
  { f: .42, col: '#110522', win: ['#56e0ff', '#ffd36a', '#ff4fa3'], hmin: 70, hmax: 175, b: [], scroll: 0 }
];
function makeBld(Ly) {
  const w = rnd(50, 140) | 0, h = rnd(Ly.hmin, Ly.hmax) | 0, top = 30;
  const c = document.createElement('canvas'); c.width = w * 2; c.height = (h + top) * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  g.fillStyle = Ly.col; g.fillRect(0, top, w, h);
  if (Math.random() < .5) { const rw = w * rnd(.2, .4), rh = rnd(8, 24); g.fillRect(w * .2, top - rh, rw, rh + 1); }
  const ant = Math.random() < .45;
  if (ant) g.fillRect(w * .6, 2, 2, top);
  const ww = 4 + (Math.random() * 3 | 0), gx = 9 + (Math.random() * 4 | 0), wc = pick(Ly.win);
  for (let y = top + 10; y < top + h - 8; y += 11) for (let x = 6; x < w - 8; x += gx) {
    if (Math.random() < .33) { g.globalAlpha = rnd(.2, .9); g.fillStyle = Math.random() < .85 ? wc : pick(Ly.win); g.fillRect(x, y, ww, 5); }
  }
  g.globalAlpha = 1;
  if (Math.random() < .3) { g.fillStyle = pick(Ly.win); g.globalAlpha = .85; const sy = top + rnd(15, h * .5); g.fillRect(4, sy, w - 8, 3); g.fillRect(4, sy + 12, w - 8, 3); g.globalAlpha = 1; }
  return { c, w, h: h + top, x: 0, ant, blink: rnd(0, TAU) };
}
for (let i = 0; i < 90; i++) stars4.push({ x: rnd(0, 3000), y: rnd(0, GY - 160), s: rnd(.5, 2), tw: rnd(0, TAU) });

function updBG(dt) {
  gscroll += speed * dt;
  for (const Ly of layers) {
    Ly.scroll += speed * Ly.f * dt;
    let maxR = Ly.b.length ? -1e9 : Ly.scroll - 60;
    for (const b of Ly.b) maxR = Math.max(maxR, b.x + b.w);
    for (const b of Ly.b) if (b.x - Ly.scroll + b.w < -30) { b.x = maxR + rnd(4, 30) * (Ly.f > .3 ? 2.5 : 1); maxR = b.x + b.w; }
    while (maxR - Ly.scroll < LW + 200) { const b = makeBld(Ly); b.x = maxR + rnd(4, 30) * (Ly.f > .3 ? 2.5 : 1); maxR = b.x + b.w; Ly.b.push(b); }
  }
  fgT -= dt;
  if (fgT <= 0) { fg.push({ x: LW + 120 }); fgT = rnd(1.5, 3.4); }
  for (const f of fg) f.x -= speed * 1.45 * dt;
  fg = fg.filter(f => f.x > -200);
  // 스피드 라인
  const fast = P && (P.dash > 0 || speed > 560 || slowmo > 0);
  if (fast && Math.random() < (P.dash > 0 ? 1 : .5)) for (let i = 0; i < (P.dash > 0 ? 3 : 1); i++)
    lines.push({ x: LW + rnd(0, 80), y: rnd(10, LH - 10), len: rnd(80, 280), v: rnd(1800, 3200), a: rnd(.08, .3) });
  for (const l of lines) l.x -= l.v * dt;
  lines = lines.filter(l => l.x + l.len > -20);
}

function drawSky() {
  if (!skyG) {
    skyG = ctx.createLinearGradient(0, 0, 0, GY);
    skyG.addColorStop(0, '#07021a'); skyG.addColorStop(.42, '#250842'); skyG.addColorStop(.72, '#5e1260');
    skyG.addColorStop(.92, '#e8436e'); skyG.addColorStop(1, '#ffa45e');
  }
  ctx.fillStyle = skyG; ctx.fillRect(-80, -80, LW + 160, GY + 80);
  // 별
  for (const s of stars4) {
    const x = ((s.x - gscroll * .01) % (LW + 40) + LW + 40) % (LW + 40) - 20;
    ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(time * 2 + s.tw)) * (1 - s.y / GY);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  // 태양
  const cx = LW * .68, cy = GY - 95, r = 125;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(cx, cy, r * .6, cx, cy, r * 2.4);
  gl.addColorStop(0, 'rgba(255,90,140,.35)'); gl.addColorStop(1, 'rgba(255,90,140,0)');
  ctx.fillStyle = gl; ctx.fillRect(cx - r * 2.5, cy - r * 2.5, r * 5, r * 5); ctx.restore();
  const sg = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  sg.addColorStop(0, '#fff17a'); sg.addColorStop(.5, '#ff9d4a'); sg.addColorStop(1, '#ff2f86');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.fillStyle = skyG;
  for (let i = 0; i < 9; i++) {
    const yy = cy - 12 + ((i * 15 + time * 14) % 135), hh = 1 + (yy - (cy - 12)) / 135 * 10;
    ctx.fillRect(cx - r - 2, yy, r * 2 + 4, hh);
  }
  // 구름 띠
  ctx.fillStyle = '#ff9ad5';
  for (let i = 0; i < 5; i++) {
    const w = 260 + i * 70, x = LW + 200 - ((time * 12 * (i + 1) + i * 377) % (LW + w + 400)), y = 110 + i * 42;
    ctx.globalAlpha = .07 + i * .015; ctx.fillRect(x, y, w, 5 + i); ctx.fillRect(x + 60, y + 9, w * .6, 3);
  }
  ctx.globalAlpha = 1;
}
function drawLayers() {
  layers.forEach((Ly, i) => {
    for (const b of Ly.b) {
      const x = b.x - Ly.scroll; if (x > LW + 40 || x + b.w < -40) continue;
      ctx.drawImage(b.c, x, GY - b.h, b.w, b.h);
      if (b.ant) { ctx.fillStyle = `rgba(255,40,90,${.5 + .5 * Math.sin(time * 3 + b.blink)})`; ctx.fillRect(x + b.w * .6 - 1, GY - b.h, 4, 4); }
    }
    if (i < 2) {
      const fg2 = ctx.createLinearGradient(0, GY - 200, 0, GY);
      fg2.addColorStop(0, 'rgba(120,30,130,0)'); fg2.addColorStop(1, `rgba(120,30,130,${i ? .35 : .5})`);
      ctx.fillStyle = fg2; ctx.fillRect(-80, GY - 200, LW + 160, 200);
    }
  });
}
function drawGround() {
  const g = ctx.createLinearGradient(0, GY, 0, LH);
  g.addColorStop(0, '#22083c'); g.addColorStop(1, '#05010c');
  ctx.fillStyle = g; ctx.fillRect(-80, GY, LW + 160, LH - GY + 80);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,60,200,.32)'; ctx.lineWidth = 1.5; ctx.beginPath();
  const off = gscroll % 60;
  for (let i = -30; i < LW / 60 + 30; i++) { const x0 = i * 60 - off; ctx.moveTo(x0, GY); ctx.lineTo(LW / 2 + (x0 - LW / 2) * 4, LH + 60); }
  for (let i = 1; i < 7; i++) { const y = GY + Math.pow(i / 6, 1.8) * (LH - GY + 20); ctx.moveTo(-80, y); ctx.lineTo(LW + 80, y); }
  ctx.stroke();
  ctx.strokeStyle = '#5ff'; ctx.lineWidth = 3; ctx.shadowColor = '#3ff0ff'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(-80, GY); ctx.lineTo(LW + 80, GY); ctx.stroke();
  ctx.restore();
}
function drawFG() {
  for (const f of fg) {
    for (let k = 2; k >= 0; k--) {
      ctx.globalAlpha = k ? .18 / k : 1;
      const x = f.x + k * 14;
      ctx.fillStyle = '#04010a'; ctx.fillRect(x, GY - 300, 12, 400); ctx.fillRect(x - 46, GY - 300, 58, 7);
    }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(f.x - 38, GY - 290, 0, f.x - 38, GY - 290, 90);
    lg.addColorStop(0, 'rgba(120,250,255,.6)'); lg.addColorStop(1, 'rgba(120,250,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(f.x - 130, GY - 380, 180, 180);
    ctx.fillStyle = '#dfffff'; ctx.fillRect(f.x - 46, GY - 293, 22, 4);
    ctx.restore();
  }
}

/* ---------------- 이펙트 헬퍼 ---------------- */
function addPart(x, y, vx, vy, life, size, col, type, g) {
  if (parts.length > 900) parts.shift();
  parts.push({ x, y, vx, vy, life, max: life, size, col, type: type || 'spark', g: g == null ? 500 : g, rot: rnd(0, TAU), vr: rnd(-12, 12) });
}
function sparks(x, y, n, cols, pow) {
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(200, 750) * (pow || 1); addPart(x, y, Math.cos(a) * v, Math.sin(a) * v, rnd(.2, .5), rnd(1.5, 3.5), pick(cols), 'spark', 400); }
}
function addDust(x, y, n, sc) {
  for (let i = 0; i < n; i++) addPart(x + rnd(-10, 10), y - rnd(0, 6), rnd(-160, 60) * sc, rnd(-90, -10) * sc, rnd(.35, .7), rnd(5, 11) * sc, '#b9a3e0', 'dust', -40);
}
function ring(x, y, r0, r1, col, life, w, delay) { rings.push({ x, y, r0, r1, col, life, max: life, w, delay: delay || 0 }); }
function addText(x, y, s, col, size) { texts.push({ x, y, s, col, size: size || 22, t: 0, max: .9 }); }
function hitStar(x, y, size) { rings.push({ star: true, x, y, rot: rnd(-.7, .7), size: size || rnd(60, 90), life: .16, max: .16, delay: 0 }); }
function banner(txt, sub, col, dur) { banners = [{ txt, sub, col, t: 0, dur: dur || 1.6 }]; }
function ghost(p) {
  ghosts.push({ x: p.x, y: p.y, phase: p.phase, onG: p.onG, vy: p.vy, dash: p.dash, atk: p.atk, atkDur: p.atkDur, atkType: p.atkType, slam: p.slam, spin: p.spin, squash: p.squash, dead: false, life: .26, max: .26 });
}

/* ---------------- 플레이어 ---------------- */
function newPlayer() {
  const x = Math.min(LW * .24, 300), sc = [];
  for (let i = 0; i < 12; i++) sc.push({ x: x - i * 8, y: GY - 80 });
  return { x, y: GY, vy: 0, onG: true, jumps: 0, hp: 5, maxHp: 5, en: 0, dispEn: 0, atk: 0, atkDur: .22, atkType: 1, atkCD: 0,
    comboStep: 0, comboWin: 0, dash: 0, dashCD: 0, dashInv: 0, inv: 0, phase: 0, squash: 1, spin: 0, slam: false, lunge: 0,
    dead: false, rot: 0, vr: 0, dvx: 0, hitList: new Set(), dashHits: new Set(), scarf: sc, ghostT: 0, stepS: 0, hpFlash: 0, ready: false };
}
function jump() {
  const p = P; if (p.dead) return;
  if (p.onG || p.jumps < 2) {
    const second = !p.onG;
    p.vy = second ? -770 : -850; p.jumps = second ? 2 : 1; p.onG = false; p.slam = false; p.dash = Math.min(p.dash, 0); p.squash = 1.3;
    if (second) {
      p.spin = .38; ring(p.x, p.y - 20, 8, 75, '#3ff0ff', .3, 4);
      for (let i = 0; i < 12; i++) { const a = rnd(0, PI); addPart(p.x, p.y - 10, Math.cos(a) * 260, Math.sin(a) * 140, .4, 3, '#3ff0ff', 'spark', 0); }
      sfx.jump2();
    } else { addDust(p.x, GY, 10, 1.2); sfx.jump(); }
  }
}
function attack() {
  const p = P; if (p.dead || p.atkCD > 0) return;
  if (!p.onG && (keys.KeyS || keys.ArrowDown) && !p.slam) {
    p.slam = true; p.dash = 0; p.atk = 0; p.vy = 1800; p.dashHits = new Set(); sfx.dash();
    ring(p.x, p.y - 40, 10, 60, '#fff', .25, 3); return;
  }
  if (p.slam) return;
  if (p.onG) { p.comboStep = p.comboWin > 0 ? (p.comboStep % 3) + 1 : 1; p.atkType = p.comboStep; }
  else { p.atkType = 4; p.comboStep = 0; if (p.vy > -120) p.vy = -280; }
  p.atkDur = p.atkType === 3 ? .32 : p.atkType === 4 ? .3 : .22;
  p.atk = p.atkDur; p.atkCD = p.atkType === 3 ? .28 : .11; p.comboWin = p.atkDur + .32; p.hitList = new Set();
  slashes.push({ t: 0, dur: p.atkDur + .1, type: p.atkType });
  sfx.slash();
  if (p.atkType === 3) { p.lunge = .14; tone(220, 70, .22, 'sawtooth', .08); }
}
function dash() {
  const p = P; if (p.dead || p.dashCD > 0) return;
  p.dash = .2; p.dashCD = .55; p.dashInv = .34; p.slam = false; p.vy = 0; p.ghostT = 0; p.dashHits = new Set();
  sfx.dash(); ring(p.x, p.y - 45, 10, 85, '#3ff0ff', .3, 5); addDust(p.x, GY, 6, 1); zoom = Math.max(zoom, 1.03);
}
function special() {
  const p = P; if (p.dead || p.en < 100) return;
  p.en = 0; p.ready = false; p.dashInv = 1.1;
  beams.push({ x: p.x + 40, y: p.y - 60, t: 0, dur: 1.0, hit: false });
  slowmo = .55; flash = .9; flashCol = '#bffcff'; shake = Math.max(shake, 30); zoom = 1.09; focus = 1;
  ring(p.x + 40, p.y - 60, 10, 220, '#fff', .5, 10); ring(p.x + 40, p.y - 60, 10, 340, '#3ff0ff', .7, 6, .08);
  sfx.special(); banner('LIMIT BREAK', '섬광참 — 화면의 모든 악당을 베어라!', '#3ff0ff', 1.3);
}
function hurtPlayer() {
  const p = P; if (p.dead || p.inv > 0 || p.dashInv > 0 || p.dash > 0) return;
  p.hp--; p.inv = 1.4; p.hpFlash = .6;
  shake = Math.max(shake, 18); flash = .45; flashCol = '#ff1e46'; hitstop = .09; combo = 0; comboT = 0; sfx.hurt();
  p.vy = -480; p.onG = false; p.slam = false; p.atk = 0;
  sparks(p.x, p.y - 50, 22, ['#ff2d55', '#fff']); ring(p.x, p.y - 50, 10, 95, '#ff2d55', .3, 6);
  addText(p.x, p.y - 115, '-1', '#ff2d55', 32);
  if (p.hp <= 0) {
    p.dead = true; p.vy = -720; p.dvx = -150; p.vr = -9; slowmo = 1.4; deathT = 2.3; flash = .9; zoom = 1.1;
    sfx.kill(); banner('K.O.', '쓰러졌다...', '#ff2d55', 2);
  }
}
function land(p, vy) {
  if (p.slam) { slamImpact(); p.slam = false; }

/* ---------------- 렌더 ---------------- */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05030c'; ctx.fillRect(0, 0, cv.width, cv.height);
  const k = DPR * S; ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.save();
  const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake, zx = P.x, zy = P.y - 50;
  ctx.translate(zx + sx, zy + sy); ctx.scale(zoom, zoom); ctx.translate(-zx, -zy);
  drawSky(); drawLayers(); drawGround();
  for (const h of hazards) drawHazard(h);
  for (const o of orbs) {
    if (o.type === 'hp') {
      const pu = 1 + Math.sin(time * 8) * .12;
      ctx.save(); ctx.translate(o.x, o.y + Math.sin(time * 4) * 4); ctx.scale(pu, pu);
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,90,150,.35)'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#ff6a9a';
      ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-16, -2, -9, -16, 0, -7); ctx.bezierCurveTo(9, -16, 16, -2, 0, 9); ctx.fill(); ctx.restore();
    } else {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(63,240,255,.4)';
      ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(o.x, o.y, 3.5, 0, TAU); ctx.fill(); ctx.restore();
    }
  }
  for (const c of corpses) {
    const a = c.t > 1.1 ? 1 - (c.t - 1.1) / .7 : 1;
    if (c.type === 'drone') { drawDrone(c.x, c.y, c.t, c.t < .08, a, c.rot, c.glow); continue; }
    const fl = c.t < .08;
    drawMan({ x: c.x, y: c.y, s: c.s, face: -1, limp: true, rot: c.rot, kind: c.type, body: fl ? '#fff' : c.body, dark: fl ? '#fff' : c.dark, glow: c.glow, alpha: clamp(a, 0, 1), thick: c.type === 'brute' ? 1.4 : 1 });
  }
  for (const e of enemies) drawEnemy(e);
  for (const b of bullets) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = b.col; ctx.lineWidth = b.r * 1.2; ctx.lineCap = 'round'; ctx.globalAlpha = .5;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .05, b.y - b.vy * .05); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .45, 0, TAU); ctx.fill(); ctx.restore();
  }
  for (const g of ghosts) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawMan(heroPose(g, (g.life / g.max) * .55, g.slam ? '#a68bff' : '#3ff0ff')); ctx.restore();
  }
  drawPlayer();
  for (const s of slashes) drawSlash(s);
  drawParts(); drawRings();
  for (const b of beams) drawBeam(b);
  drawTexts();
  drawFG();
  ctx.restore();

  // 스크린 공간 이펙트
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#e8f6ff'; ctx.lineWidth = 1.5;
  for (const l of lines) { ctx.globalAlpha = l.a; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke(); }
  ctx.restore();
  if (focus > 0) drawFocus(focus, P.x + 60, P.y - 60);
  if (!vig) { vig = ctx.createRadialGradient(LW / 2, LH / 2, LH * .35, LW / 2, LH / 2, Math.max(LW, LH) * .75); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.6)'); }
  ctx.fillStyle = vig; ctx.fillRect(0, 0, LW, LH);
  if (state === 'play' && P.hp === 1 && !P.dead) { ctx.fillStyle = `rgba(255,20,60,${.12 + .1 * Math.sin(time * 8)})`; ctx.fillRect(0, 0, LW, 6); ctx.fillRect(0, LH - 6, LW, 6); ctx.fillRect(0, 0, 6, LH); ctx.fillRect(LW - 6, 0, 6, LH); }
  if (warnT > 0) {
    ctx.save(); ctx.globalAlpha = .25 + .2 * Math.sin(time * 18);
    const eg = ctx.createLinearGradient(0, 0, 60, 0); eg.addColorStop(0, '#ff1e3c'); eg.addColorStop(1, 'rgba(255,30,60,0)');
    ctx.fillStyle = eg; ctx.fillRect(0, 0, 60, LH);
    ctx.translate(LW, 0); ctx.scale(-1, 1); ctx.fillRect(0, 0, 60, LH); ctx.restore();
  }
  if (flash > 0) { ctx.globalAlpha = clamp(flash, 0, 1) * .7; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
  for (const b of banners) drawBanner(b);
  if (state === 'play') { drawHUD(); if (isTouch) drawButtons(); }
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused && state === 'play') { ctx.fillStyle = 'rgba(5,2,15,.6)'; ctx.fillRect(0, 0, LW, LH); txt('PAUSED', LW / 2, LH / 2 - 10, 64, '#fff', { st: 6 }); txt('P 키 또는 탭하여 계속', LW / 2, LH / 2 + 40, 18, '#ffb3e6', { it: false, st: 4 }); }
  if (muted) txt('🔇', LW - 22, LH - 20, 16, '#fff', { it: false });
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(10,4,30,.7)'; para(14, 14, 92, 30, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(63,240,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
    txt('← 메뉴 (Q)', 62, 29, 13, '#3ff0ff', { it: false });
  }
}
const goMenu = () => { location.href = 'index.html'; };

/* ---------------- 입력 ---------------- */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys[k] = true; initAudio();
  if (k === 'KeyM') { muted = !muted; return; }
  if (k === 'KeyQ' && state !== 'play') { goMenu(); return; }
  if (state === 'title') { if (k === 'Space' || k === 'Enter') start(); return; }
  if (state === 'over') { if ((k === 'Space' || k === 'Enter') && overT > 1) start(); return; }
  if (k === 'KeyP' || k === 'Escape') { paused = !paused; return; }
  if (paused) return;
  if (k === 'Space' || k === 'KeyW' || k === 'ArrowUp') jump();
  else if (k === 'KeyJ' || k === 'KeyX' || k === 'KeyZ') attack();
  else if (k === 'KeyK' || k === 'ShiftLeft' || k === 'ShiftRight' || k === 'KeyC') dash();
  else if (k === 'KeyE' || k === 'KeyL' || k === 'KeyV') special();
  else if ((k === 'KeyS' || k === 'ArrowDown') && !P.onG && !P.slam) attack();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch') isTouch = true;
  const x = e.clientX / S, y = e.clientY / S;
  if (state !== 'play' && x < 112 && y < 50) { goMenu(); return; }
  if (state === 'title') { start(); return; }
  if (state === 'over') { if (overT > 1) start(); return; }
  if (paused) { paused = false; return; }
  if (e.pointerType === 'touch') {
    for (const b of buttons()) if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + 14) ** 2) { b.fn(); return; }
    if (x < LW / 2) jump(); else attack();
  } else { if (e.button === 2) dash(); else attack(); }
});
addEventListener('blur', () => { if (state === 'play') paused = true; });

/* ---------------- 시작 ---------------- */
addEventListener('resize', resize);
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth || 960; H = innerHeight || 540;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); S = H / LH; LW = W / S; skyG = null; vig = null;
  if (P && !isFinite(P.x)) { const np = newPlayer(); P.x = np.x; P.scarf = np.scarf; }
}
resize();
P = newPlayer();
let last = performance.now();
function loop(t) {
  const rdt = Math.min(.033, (t - last) / 1000); last = t;
  update(rdt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
